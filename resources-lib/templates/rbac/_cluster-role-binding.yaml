{{- define "resources-lib.cluster-role-binding.template" -}}
{{- `
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  {{- with .annotations }}
  annotations: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .finalizers }}
  finalizers: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .labels }}
  labels: {{- . | toYaml | nindent 4 }}
  {{- end }}
  name: {{ .name }}
{{- with .roleRef }}
roleRef: {{- . | toYaml | nindent 2 }}
{{- end }}
{{- if and .subjectsObject .subjects }}
  {{- fail "Specify either 'subjectsObject' or 'subjects', not both." }}
{{- end }}
{{- with .subjectsObject }}
{{- $subjects := include "resources-lib.utils.map-to-list" (dict "map" . "field" "name") | fromYamlArray }}
subjects: {{ include "resources-lib.utils.render-object" (dict "value" $subjects "indent" 2) }}
{{- else with .subjects }}
subjects: {{- . | toYaml | nindent 2 }}
{{- end }}
` -}}
{{- end -}}

{{- define "resources-lib.cluster-role-binding.build" -}}
  {{- tpl (include "resources-lib.cluster-role-binding.template" nil | trim) . -}}
{{- end -}}
