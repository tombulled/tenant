{{- range include "tenant.resource.list" (dict
  "root" $
  "values" .Values.projects
  "defaults" .Values.projectDefaults
) | fromYamlArray }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  {{- with .annotations }}
  annotations: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .labels }}
  labels: {{- . | toYaml | nindent 4 }}
  {{- end }}
  name: {{ .name }}
  {{- with .namespace }}
  namespace: {{ . }}
  {{- end }}
  {{- with .finalizers }}
  finalizers: {{- . | toYaml | nindent 4 }}
  {{- end }}
spec:
  {{- if ne .permitOnlyProjectScopedClusters nil }}
  permitOnlyProjectScopedClusters: {{ .permitOnlyProjectScopedClusters }}
  {{- end }}
  {{- with .description }}
  description: {{ . | quote }}
  {{- end }}
  {{- with .sourceRepos }}
  sourceRepos: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .destinationsObject }}
  destinations:
    {{- range $id, $_ := . }}
    {{- $_ := set . "namespace" (.namespace | default $id) }}
    {{- if and (eq .name nil) (eq .server nil) }}
      {{- $_ := set . "name" "in-cluster" }}
    {{- end }}
    - {{ . | toYaml | indent 6 | trim }}
    {{- end }}
  {{- else with .destinations }}
  destinations: {{- . | toYaml | nindent 4 }}
  {{- end }}

  {{- if and (ne .clusterResourceWhitelistObject nil) (ne .clusterResourceWhitelist nil) }}
    {{- fail "Specify either clusterResourceWhitelistObject or clusterResourceWhitelist, not both." }}
  {{- end }}

  {{- if ne .clusterResourceWhitelistObject nil }}
  {{- $clusterResourceWhitelist := include "tenant.utils.map-to-list" (dict "map" .clusterResourceWhitelistObject) | fromYamlArray }}
  clusterResourceWhitelist: {{ include "tenant.utils.render-object" (dict "value" $clusterResourceWhitelist "indent" 4) }}
  {{- end }}

  {{- if ne .clusterResourceWhitelist nil }}
  clusterResourceWhitelist: {{ include "tenant.utils.render-object" (dict "value" .clusterResourceWhitelist "indent" 4) }}
  {{- end }}

  {{- with .clusterResourceBlacklistObject }}
  {{- with include "tenant.utils.map-to-list" (dict "map" .) | fromYamlArray }}
  clusterResourceBlacklist: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- else with .clusterResourceBlacklist }}
  clusterResourceBlacklist: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .namespaceResourceBlacklistObject }}
  {{- with include "tenant.utils.map-to-list" (dict "map" .) | fromYamlArray }}
  namespaceResourceBlacklist: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- else with .namespaceResourceBlacklist }}
  namespaceResourceBlacklist: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .namespaceResourceWhitelistObject }}
  {{- with include "tenant.utils.map-to-list" (dict "map" .) | fromYamlArray }}
  namespaceResourceWhitelist: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- else with .namespaceResourceWhitelist }}
  namespaceResourceWhitelist: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .orphanedResources }}
  orphanedResources: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .rolesObject }}
  {{- with include "tenant.utils.map-to-list" (dict "map" . "field" "name") | fromYamlArray }}
  roles: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- else with .roles }}
  roles: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .syncWindows }}
  syncWindows: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .signatureKeys }}
  signatureKeys: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .sourceNamespaces }}
  sourceNamespaces: {{- . | toYaml | nindent 4 }}
  {{- end }}
{{- end }}
