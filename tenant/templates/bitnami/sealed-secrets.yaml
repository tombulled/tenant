{{- range include "tenant.resources.sealed-secrets" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "bitnami.com/v1alpha1"
  "kind" "SealedSecret"
  "metadata" (include "tenant.metadata" (dict "data" .) | fromYaml)
  "spec" (dict
    "data" .data
    "encryptedData" (.encryptedData | default (dict))
    "template" .template
  )
) | include "tenant.utils.filter-map" }}
{{- end }}
