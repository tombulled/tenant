{{- define "tenant.application-set.generators" -}}
  {{- $generators := ternary (.generatorsObject | values) .generators (not (empty .generatorsObject)) -}}

  {{- /* Add a match expression to the selector of all generators that filters out disabled applications */ -}}
  {{- range $generators -}}
      {{- $matchExpression := (dict
        "key" "enabled"
        "operator" "NotIn"
        "values" (list "false")
      ) -}}

      {{- $_ := set . "selector" (.selector | default dict) -}}
      {{- $matchExpressions := $matchExpression | append (.selector.matchExpressions | default list) -}}
      {{- $_ := set .selector "matchExpressions" $matchExpressions -}}
  {{- end -}}

  {{- $generators | toYaml -}}
{{- end -}}

{{- range $id, $_ := .Values.applicationSets -}}
{{- with include "build-resource-data" (dict "root" $ "id" $id "data" . "defaults" $.Values.applicationSetDefaults) | fromYaml }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  {{- with .annotations }}
  annotations: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .labels }}
  labels: {{- . | toYaml | nindent 4 }}
  {{- end }}
  name: {{ .name }}
  {{- with .namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
  {{- if ne .applyNestedSelectors nil }}
  applyNestedSelectors: {{ .applyNestedSelectors }}
  {{- end }}
  {{- with include "tenant.application-set.generators" . | fromYamlArray }}
  generators: {{- . | toYaml | nindent 4 }}
  {{- else }}
  generators: []
  {{- end }}
  goTemplate: true
  {{- with .goTemplateOptionsObject }}
  goTemplateOptions:
    {{- range $key, $val := . }}
    - {{ printf "%s=%s" $key (toString $val) }}
    {{- end }}
  {{- else with .goTemplateOptions }}
  goTemplateOptions: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .ignoreApplicationDifferences }}
  ignoreApplicationDifferences: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .preservedFields }}
  preservedFields: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .strategy }}
  strategy: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .syncPolicy }}
  syncPolicy: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .template }}
  template: {{- . | toYaml | nindent 4 }}
  {{- end }}
  templatePatch: |
    {{- include "application-template" $ | nindent 4 }}
{{- end }}
{{- end }}
