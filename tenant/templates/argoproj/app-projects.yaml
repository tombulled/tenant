{{- range include "tenant.resources.app-projects" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "argoproj.io/v1alpha1"
  "kind" "AppProject"
  "metadata" (include "tenant.metadata2" (dict "data" .) | fromYaml)
  "spec" (dict
    "permitOnlyProjectScopedClusters" .permitOnlyProjectScopedClusters
    "description" .description
    "sourceRepos" .sourceRepos
    "destinations" (ternary
      .destinations
      (include "tenant.utils.list-or-map" (dict
        "value" .destinations
        "propagateMapKeyToField" "namespace"
      ) | fromYamlArray)
      (eq .destinations nil)
    )
    "clusterResourceBlacklist" (ternary
      .clusterResourceBlacklist
      (include "tenant.utils.list-or-map" (dict
        "value" .clusterResourceBlacklist
      ) | fromYamlArray)
      (eq .clusterResourceBlacklist nil)
    )
    "clusterResourceWhitelist" (ternary
      .clusterResourceWhitelist
      (include "tenant.utils.list-or-map" (dict
        "value" .clusterResourceWhitelist
      ) | fromYamlArray)
      (eq .clusterResourceWhitelist nil)
    )
    "namespaceResourceBlacklist" (ternary
      .namespaceResourceBlacklist
      (include "tenant.utils.list-or-map" (dict
        "value" .namespaceResourceBlacklist
      ) | fromYamlArray)
      (eq .namespaceResourceBlacklist nil)
    )
    "namespaceResourceWhitelist" (ternary
      .namespaceResourceWhitelist
      (include "tenant.utils.list-or-map" (dict
        "value" .namespaceResourceWhitelist
      ) | fromYamlArray)
      (eq .namespaceResourceWhitelist nil)
    )
    "orphanedResources" .orphanedResources
    "roles" (ternary
      .roles
      (include "tenant.utils.list-or-map" (dict
        "value" .roles
        "propagateMapKeyToField" "name"
      ) | fromYamlArray)
      (eq .roles nil)
    )
    "syncWindows" (ternary
      .syncWindows
      (include "tenant.utils.list-or-map" (dict
        "value" .syncWindows
      ) | fromYamlArray)
      (eq .syncWindows nil)
    )
    "signatureKeys" (ternary
      .signatureKeys
      (include "tenant.utils.list-or-map" (dict
        "value" .signatureKeys
        "propagateMapKeyToField" "keyID"
      ) | fromYamlArray)
      (eq .signatureKeys nil)
    )
    "sourceNamespaces" .sourceNamespaces
  )
) | include "tenant.utils.filter-map" }}
{{- end }}
