{{- range include "tenant.resources.network-policies" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "networking.k8s.io/v1"
  "kind" "NetworkPolicy"
  "metadata" (include "tenant.metadata" (dict "data" .) | fromYaml)
  "spec" (dict
    "egress" .egress
    "ingress" .ingress
    "podSelector" (.podSelector | default (dict))
    "policyTypes" .policyTypes
  )
) | toYaml | include "tenant.utils.post-render" }}
{{- end }}
