{{- range include "tenant.resources.role-bindings" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "rbac.authorization.k8s.io/v1"
  "kind" "RoleBinding"
  "metadata" (include "tenant.metadata" . | fromYaml)
  "roleRef" .roleRef
  "subjects" (ternary
    .subjects
    (include "tenant.utils.list-or-map" (dict
      "value" .subjects
      "propagateMapKeyToField" "name"
    ) | fromYamlArray)
    (eq .subjects nil)
  )
) | toYaml | include "tenant.utils.post-render" }}
{{- end }}
