{{- range include "tenant.resources.cluster-roles" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "rbac.authorization.k8s.io/v1"
  "kind" "ClusterRole"
  "metadata" (include "tenant.metadata2" (dict "data" . "namespace" false) | fromYaml)
  "aggregationRule" .aggregationRule
  "rules" (ternary
    .rules
    (include "tenant.utils.list-or-map" (dict
      "value" .rules
      "propagateMapKeyToField" "name"
    ) | fromYamlArray)
    (eq .rules nil)
  )
) | include "tenant.utils.filter-map" }}
{{- end }}
