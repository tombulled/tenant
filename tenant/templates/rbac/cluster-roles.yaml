{{- range include "tenant.resources.cluster-roles" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "rbac.authorization.k8s.io/v1"
  "kind" "ClusterRole"
  "metadata" (omit (include "tenant.metadata" . | fromYaml) "namespace")
  "aggregationRule" .aggregationRule
  "rules" (ternary
    .rules
    (include "tenant.utils.list-or-map" (dict
      "value" .rules
      "propagateMapKeyToField" "name"
    ) | fromYamlArray)
    (eq .rules nil)
  )
) | include "tenant.utils.post-render" }}
{{- end }}
