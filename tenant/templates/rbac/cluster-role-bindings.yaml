{{- range include "tenant.resources.cluster-role-bindings" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "rbac.authorization.k8s.io/v1"
  "kind" "ClusterRoleBinding"
  "metadata" (omit (include "tenant.metadata" . | fromYaml) "namespace")
  "roleRef" .roleRef
  "subjects" (ternary
    .subjects
    (include "tenant.utils.list-or-map" (dict
      "value" .subjects
      "propagateMapKeyToFields" (list "name")
    ) | fromYamlArray)
    (eq .subjects nil)
  )
) | include "tenant.utils.post-render" }}
{{- end }}
