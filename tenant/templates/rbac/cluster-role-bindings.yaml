{{- range include "tenant.resources.cluster-role-bindings" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "rbac.authorization.k8s.io/v1"
  "kind" "ClusterRoleBinding"
  "metadata" (include "tenant.metadata" (dict "data" . "namespace" false) | fromYaml)
  "roleRef" .roleRef
  "subjects" (ternary
    .subjects
    (include "tenant.utils.list-or-map" (dict
      "value" .subjects
      "propagateMapKeyToField" "name"
    ) | fromYamlArray)
    (eq .subjects nil)
  )
) | include "tenant.utils.filter-map" }}
{{- end }}
