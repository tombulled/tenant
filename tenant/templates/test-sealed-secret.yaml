{{- range include "tenant.resources.sealed-secrets" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "bitnami.com/v1alpha1"
  "kind" "SealedSecret"
  "metadata" (dict
    "annotations" .annotations
    "finalizers" .finalizers
    "labels" .labels
    "name" .name
    "namespace" .namespace
  )
  "spec" (dict
    "data" .data
    "encryptedData" (.encryptedData | default (dict))
    "template" .template
  )
) | include "tenant.utils.filter" }}
{{- end }}
