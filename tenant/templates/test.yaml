{{- $root := $ }}
{{- $context := $.Values }}
{{- $key := "test" }}
{{- $keyPlural := "tests" }}
{{- $defaults := (dict "annotations" (dict "some-default" "true")) }}
{{- $templateVars := dict "namespace" "some-ns" }}
{{- $templateExclude := list "resources" }}
{{- $nameField := "name" }}

{{- $value := index $context $key }}
{{- $values := index $context $keyPlural }}

{{- $entries := include "tenant.utils.entries" $values | fromYamlArray }}
{{- if ne $value nil }}
  {{- $entries = append $entries (dict "key" nil "val" $value) }}
{{- end }}
{{- range $entry := $entries }}
{{- $id := $entry.key }}
{{- $data := $entry.val }}
---
{{- with include "tenant.resource.data" (dict
  "data" $data
  "defaults" (list
    (include "tenant.utils.dynamic-set" (dict
      "keys" (splitList "." $nameField)
      "value" $id
    ) | fromYaml)
    $defaults
    $context.defaults
    (index $context (print $key "Defaults"))
  )
  "templateContext" $root
  "templateVars" (include "tenant.utils.merge" (list
    $templateVars
    (dict "id" $id)
  ) | fromYaml)
  "templateExclude" $templateExclude
  "templateFirst" (list
    $nameField
  )
) | fromYaml }}
{{ . | toYaml }}
{{- end }}
{{- end }}
