{{- range include "tenant.resource.list-with-namespaced" (dict
  "root" $
  "key" "roles"
  "defaults" $.Values.roleDefaults
) | fromYamlArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- with .annotations }}
  annotations: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .finalizers }}
  finalizers: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .labels }}
  labels: {{- . | toYaml | nindent 4 }}
  {{- end }}
  name: {{ .name }}
  {{- with .namespace }}
  namespace: {{ . }}
  {{- end }}
{{- if and .rulesObject .rules }}
  {{- fail "Specify either `rulesObject` or `rules`, not both." }}
{{- end }}
{{- with .rulesObject }}
rules: {{- . | values | toYaml | nindent 2 }}
{{- else with .rules }}
rules: {{- . | toYaml | nindent 2 }}
{{- end }}
{{- end }}
