{{- range include "tenant.resource.list" (dict
  "root" $
  "values" .Values.clusterRoles
  "defaults" .Values.clusterRoleDefaults
) | fromYamlArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  {{- with .annotations }}
  annotations: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .finalizers }}
  finalizers: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .labels }}
  labels: {{- . | toYaml | nindent 4 }}
  {{- end }}
  name: {{ .name }}
{{- with .aggregationRule }}
aggregationRule: {{- . | toYaml | nindent 4 }}
{{- end }}
{{- if and .rulesObject .rules }}
  {{- fail "Specify either `rulesObject` or `rules`, not both." }}
{{- end }}
{{- with .rulesObject }}
{{- $rules := include "tenant.utils.map-to-list" (dict "map" .) | fromYamlArray }}
rules: {{ include "tenant.utils.render-object" (dict "value" $rules "indent" 2) }}
{{- else with .rules }}
rules: {{- . | toYaml | nindent 2 }}
{{- end }}
{{- end }}
