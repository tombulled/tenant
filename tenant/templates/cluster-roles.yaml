{{- range include "tenant.resource.list-with-namespaced" (dict
  "root" $ "key" "clusterRoles" "defaults" $.Values.clusterRoleDefaults) | fromYamlArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  {{- with .annotations }}
  annotations: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .finalizers }}
  finalizers: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .labels }}
  labels: {{- . | toYaml | nindent 4 }}
  {{- end }}
  name: {{ .name }}
  {{- with .namespace }}
  namespace: {{ . }}
  {{- end }}
{{- with .aggregationRule }}
aggregationRule: {{- . | toYaml | nindent 4 }}
{{- end }}
{{- with .rulesObject }}
rules: {{- . | values | toYaml | nindent 2 }}
{{- else with .rules }}
rules: {{- . | toYaml | nindent 2 }}
{{- end }}
{{- end }}
