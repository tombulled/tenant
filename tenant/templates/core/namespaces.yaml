{{- range include "tenant.resources.namespaces" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "v1"
  "kind" "Namespace"
  "metadata" (include "tenant.metadata.no-namespace-or-finalizers" . | fromYaml)
  "spec" (dict
    "finalizers" .finalizers
  )
) | toYaml | include "tenant.utils.post-render" }}
{{- end }}
