{{- range include "tenant.resources.namespaces" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "v1"
  "kind" "Namespace"
  "metadata" (omit (include "tenant.metadata" . | fromYaml) "namespace" "finalizers")
  "spec" (dict
    "finalizers" .finalizers
  )
) | include "tenant.utils.post-render" }}
{{- end }}
