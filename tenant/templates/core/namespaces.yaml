{{- range include "tenant.resources.namespaces" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "v1"
  "kind" "Namespace"
  "metadata" (include "tenant.metadata.excluding" (list . "namespace" "finalizers") | fromYaml)
  "spec" (dict
    "finalizers" .finalizers
  )
) | include "tenant.utils.post-render" }}
{{- end }}
