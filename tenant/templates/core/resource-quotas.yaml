{{- range include "tenant.resources.resource-quotas" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "v1"
  "kind" "ResourceQuota"
  "metadata" (include "tenant.metadata2" (dict "data" .) | fromYaml)
  "spec" (dict
    "hard" (.hard | default (dict))
    "scopeSelector" .scopeSelector
    "scopes" .scopes
  )
) | include "tenant.utils.filter-map" }}
{{- end }}
