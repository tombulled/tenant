{{- range include "tenant.resources.resource-quotas" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "v1"
  "kind" "ResourceQuota"
  "metadata" (include "tenant.metadata" . | fromYaml)
  "spec" (dict
    "hard" (.hard | default (dict))
    "scopeSelector" .scopeSelector
    "scopes" .scopes
  )
) | toYaml | include "tenant.utils.post-render" }}
{{- end }}
