{{- range include "tenant.resources.limit-ranges" $ | fromYamlArray }}
---
{{ (dict
  "apiVersion" "v1"
  "kind" "LimitRange"
  "metadata" (include "tenant.metadata" (dict "data" .) | fromYaml)
  "spec" (dict
    "limits" (include "tenant.utils.list-or-map" (dict
      "value" .limits
    ) | fromYamlArray)
  )
) | include "tenant.utils.filter-map" }}
{{- end }}
