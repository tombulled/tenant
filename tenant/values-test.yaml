# namespace:
#   name: test
#   namespace: bob
#   finalizers:
#     - foo

extraResource:
  metadata:
    name: test
    annotations:
      name: ~
  spec:
    enabled: true
    fish: ~

applicationDefaults:
  sources:
    - repoURL: google.com
      chart: foo
      targetRevision: 1.2.3
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

xApplicationSet:
  name: test
  generators:
    - list:
        elements:
          - name: foo
          - name: bar
          - name: baz
      selector:
        matchLabels:
          is-cool: "true"
        matchExpressions:
          - operator: Eq
            value: bob
    - list:
        elements:
          - name: a
          - name: b
          - name: c
      selector:
        matchLabels:
          is-bad: "true"
        matchExpressions:
          - operator: Ne
            value: sally
    - x-git:
        repoURL: google.com
        directories:
          - path: "*"
        valueFiles:
          - values.yamk
          - values.-dev.uaml

clusterRole:
  name: test
  namespace: bob