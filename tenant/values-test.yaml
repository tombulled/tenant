appProjectDefaults:
  namespace: argocd
  annotations:
    is-project: "true"
    has-chips: ~
  description: "{{$id}} is cool"
  permitOnlyProjectScopedClusters: false
  sourceRepos:
    - google.com
    - null
  destinations:
    jenkins: {}
    gitlab: {}
  clusterResourceBlacklist:
    all:
      kind: "*"
      name: "*"
    namespace:
      $enabled: false
      kind: ""
      name: "Namespace"
  namespaceResourceWhitelist:
    - kind: "*"
      name: "*"
  orphanedResources:
    name: bob
  roles:
    foo:
      description: some roles
  syncWindows:
    all-apps:
      applications: "*"
  signatureKeys:
    0xabc: {}

appProjects:
  foo: {}
  bar: {}
