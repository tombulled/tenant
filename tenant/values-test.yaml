applicationSet:
  name: test
  goTemplate: true
  template:
    metadata:
      name: "{{ `{{.name}}` }}"
      annotations:
        data: "{{ `{{ $ | toJson }}` }}"
    spec:
      project: default
  generators:
    - list:
        elements:
          - name: foo
          - name: bar
          - name: baz