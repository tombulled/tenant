# namespace:
#   name: test
#   namespace: bob
#   finalizers:
#     - foo

applicationDefaults:
  sources:
    - repoURL: google.com
      chart: foo
      targetRevision: 1.2.3
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

xApplicationSet:
  name: test
  generators:
    - list:
        elements:
          - name: foo
          - name: bar
          - name: baz
      selector:
        matchLabels:
          is-cool: "true"
        matchExpressions:
          - operator: Eq
            value: bob
