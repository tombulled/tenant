# # FIXME NEXT TIME: Resource defaults aren't being applied to namespace sub-resources.
# # See example below.
# 
# resourceQuotaDefaults:
#   namespace: some-ns
# 
# namespaceDefaults:
#   resources:
#     resourceQuota:
#       name: quota
#       annotations:
#         namespace: "{{.namespace}}"
#         namespace2: "{{$namespace.name}}"
#       # namespace: other-ns
# 
# namespaces:
#   foo: {}
#   bar: {}

defaults:
  annotations:
    is-res: "true"

namespaceDefaults:
  resources:
    defaults:
      name: default-name
    resourceQuotaDefaults:
      annotations:
        is-rq: "true"
    resourceQuota: {}

namespaces:
  foo: {}
  bar: {}
