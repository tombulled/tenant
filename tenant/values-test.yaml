applicationSet:
  name: my-apps
  goTemplate: true
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - list:
                    elements:
                      - VALUES: {}
                - list:
                    elements:
                      - name: foo
                      - name: bar
                      - name: baz
          - list:
              elements:
                - INDEX: "{{ `{{ len .VALUES | toString }}` }}"
                  VALUES: "{{ `{{ set .VALUES (uuidv4) (omit . \"VALUES\" | toJson) }}` }}"
      selector:
        matchLabels:
          INDEX: "1"
  template:
    metadata:
      name: test
      annotations:
        data: "{{ `{{. | toJson}}` }}"
    spec:
      project: default
