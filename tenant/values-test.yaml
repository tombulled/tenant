applicationSet:
  name: my-apps
  goTemplate: true
  template:
    metadata:
      name: "{{ `{{.name}}` }}"
      annotations:
        data: "{{ `{{. | toJson}}` }}"
    spec:
      project: default
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - list:
                    elements:
                      - values: {}
                - list:
                    elements:
                      - name: foo
                      - name: bar
                      - name: baz
          - list:
              elements:
                - index: "{{ `{{ len .values | toString }}` }}"
                  _: "{{ `{{ $_ := set .values (uuidv4) (omit . \"values\" | toJson) }}` }}"
      selector:
        matchLabels:
          index: "1"
