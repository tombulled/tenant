applicationSet:
  name: my-apps
  goTemplate: true
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - list:
                    elements:
                      - VALUES: {}
                - list:
                    elements:
                      - name: foo
                      - name: bar
                      - name: baz
          - list:
              elements:
                - INDEX: "{{ `{{ len .VALUES | toString }}` }}"
                  VALUES: "{{ `{{ set .VALUES (uuidv4) (omit . \"VALUES\") }}` }}"
      selector:
        matchLabels:
          INDEX: "1"
  template:
    metadata:
      name: test
    spec:
      project: default
      source:
        helm:
          values: |
            applications: {{ `{{- .VALUES | values | toYaml | nindent 2 }}` }}
