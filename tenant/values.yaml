applicationSets:
  root:
    template:
      spec:
        project: default
    generators:
      - merge:
          generators:
            - git:
                 repoURL: git@github.com:example/apps.git
                 revision: main
                 files:
                   - path: "*/values.yaml"
                 values:
                   mergeKey: '{{ `{{ $_ := set . "mergeKey" .path.path }}` }}'
                   id: '{{ $_ := set . "id" .path.basename }}'
            - git:
                repoURL: git@github.com:example/apps.git
                revision: main
                files:
                  - path: "*/values-{{.metadata.cluster}}.yaml"
                values:
                  mergeKey: '{{ `{{ $_ := set . "mergeKey" .path.path }}` }}'
                  id: '{{ $_ := set . "id" .path.basename }}'
          mergeKeys:
            - mergeKey
