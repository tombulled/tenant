applicationDefaults:
  # name: "{{.id}}" # TEMP!
  destination:
    name: in-cluster
    namespace: "{{.name}}"
  sourcesObject:
    main:
      chart: "{{.name}}"
      helm:
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/{{.name}}/values.yaml
          - $values/{{.name}}/values-{{.metadata.cluster}}.yaml
    values:
      repoURL: git@github.com:example/values.git
      targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true


