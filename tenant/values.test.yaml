# project resources: applications, applicationsets, repositories, clusters, logs, exec

projectDefaults:
  rolesObject:
    foo:
      enabled: false
      name: ""
      description: ""
      policies:
        - resource: applications
          action: get
          object: "*"
          permission: allow
      policiesObject:
        applications-get: {resource: applications, action: get, object: "*", permission: "allow"}

    read-apps:
      enabled: false
      name: read-apps
      description: Read-apps privileges for {{.name}}
      policies:
        - p, proj:{{.name}}:read-apps, applications, get, {{.name}}/*, allow
        - p, proj:{{.name}}:read-apps, applicationsets, get, {{.name}}/*, allow
      groups: []
    read-all:
      enabled: false
      name: read-all
      description: Read-all privileges for {{.name}}
      policies:
        - p, proj:{{.name}}:read-all, *, get, {{.name}}/*, allow
      groups: []
    admin:
      enabled: false
      name: admin
      description: Admin privileges for {{.name}}
      policies:
        - p, proj:{{.name}}:admin, *, *, {{.name}}/*, allow
      groups: []

projects:
  foo:
    rolesObject:
      read-apps:
        enabled: true
        groups:
          - TEST_FOO
