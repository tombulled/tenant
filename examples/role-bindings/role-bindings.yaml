roleBindings:
  # Create an empty role binding with name `a` (the name is inferred from the resource ID)
  a: {}

  # Create an empty role binding with name `bee`
  b:
    name: "bee"

  # Disable a role binding
  # ... Using nil data
  c: ~
  # ... Using `enabled`
  d:
    $enabled: false

  # Create a populated role binding with a list of subjects
  e:
    name: read-pods
    namespace: default
    subjects:
      - kind: User
        name: jane
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: Role
      name: pod-reader
      apiGroup: rbac.authorization.k8s.io

  # Create a populated role binding with a map of subjects
  f:
    name: read-deployments
    namespace: default
    subjectsObject:
      sally:
        kind: User
        apiGroup: rbac.authorization.k8s.io
      bob:
        $enabled: false
        kind: User
        apiGroup: rbac.authorization.k8s.io
      daniel: ~
    roleRef:
      kind: Role
      name: deployment-reader
      apiGroup: rbac.authorization.k8s.io

  # Role binding with all fields populated
  g:
    $enabled: true # If omitted, defaults to true
    name: fully-populated # If omitted, defaults to the resource ID
    namespace: some-namespace
    annotations:
      owning-team: some-cool-team
    labels:
      is-system: "true"
    finalizers:
      - some-finalizer
    subjects:
      - kind: User
        name: jane
        apiGroup: rbac.authorization.k8s.io
    # Only `subjects` or `subjectsObject` can be specified, so the above could also be declared as:
    # subjectsObject:
    #   sally:
    #     kind: User
    #     apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: Role
      name: pod-reader
      apiGroup: rbac.authorization.k8s.io

  # Role binding with templated field
  h:
    name: foo
    annotations:
      my-name-is: "{{.name}}"
