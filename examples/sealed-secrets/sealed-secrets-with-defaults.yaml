sealedSecretDefaults:
  # Disable sealed secrets by default
  $enabled: false
  # Assign a default name (in this case, all sealed secrets will be prefixed with `ss-` by default)
  name: "ss-{{.id}}"
  # Assign a default namespace
  namespace: sealed-secrets
  # Default annotations
  annotations:
    my-name-is: "{{.name}}"
  # Default labels
  labels:
    is-system: "true"
  # Default finalizers
  finalizers:
    - some-finalizer

# All of the below sealed secrets will inherit the defaults, and can optionally
# override fields as required.
sealedSecrets:
  # This sealed secret won't get created as they're disabled by default
  foo:
    encryptedData:
      password: some-encrypted-password

  # This sealed secret will get created, as it enables itself
  bar:
    $enabled: true
    encryptedData:
      key: some-encrypted-key

  # This sealed secret will get created, and overrides some of the defaults
  baz:
    $enabled: true
    name: baz # Overrides the name to remove the `ss-` prefix
    namespace: my-secret-namespace
    annotations:
      is-baz: "true"
    finalizers: []
    encryptedData:
      token: some-encrypted-token
