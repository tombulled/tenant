sealedSecrets:
  # Create an empty sealed secret named `a`
  a: {}

  # Create an empty sealed secret named `bee`
  b:
    name: bee

  # Disable a sealed secret
  # ... Using nil data
  c: ~
  # ... Using `enabled`
  d:
    enabled: false

  # Create a sealed secret with some encrypted data
  e:
    encryptedData:
      password: some-encrypted-value

  # Sealed secret with all fields populated
  f:
    enabled: true # If omitted, defaults to true
    name: fully-populated # If omitted, defaults to the resource ID
    namespace: some-namespace
    annotations:
      owning-team: some-cool-team
    labels:
      is-system: "true"
    finalizers:
      - some-finalizer
    data: some-data
    encryptedData:
      password: some-encrypted-value
    template:
      metadata:
        name: different-name
        namespace: different-namespace
