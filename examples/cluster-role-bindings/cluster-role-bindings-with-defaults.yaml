clusterRoleBindingDefaults:
  # Disable cluster role bindings by default
  $enabled: false
  # Assign a default name (in this case, all cluster role bindings will be prefixed with `crb-` by default)
  name: "crb-{{.id}}"
  # Default annotations
  annotations:
    my-name-is: "{{.name}}"
  # Default labels
  labels:
    is-role-binding: "true"
  # Default finalizers
  finalizers:
    - some-finalizer

# All of the below cluster role bindings will inherit the defaults, and can optionally
# override fields as required.
clusterRoleBindings:
  # This cluster role binding won't get created as they're disabled by default
  foo: {}

  # This cluster role binding will get created, as it enables itself
  bar:
    $enabled: true

  # This cluster role binding will get created, and overrides some of the defaults
  baz:
    $enabled: true
    name: baz # Overrides the name to remove the `crb-` prefix
    annotations:
      is-baz: "true"
    labels: ~
    finalizers: ~
    subjects:
      - kind: User
        name: jane
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: Role
      name: pod-reader
      apiGroup: rbac.authorization.k8s.io
