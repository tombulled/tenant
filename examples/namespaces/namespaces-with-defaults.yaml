namespaceDefaults:
  # Disable namespaces by default
  enabled: false
  # Assign a default name (in this case, all namespaces will be prefixed with `ns-` by default)
  name: "ns-{{.id}}"
  # Default annotations
  annotations:
    my-name-is: "{{.name}}"
  # Default labels
  labels:
    is-system: "true"
  # Default finalizers
  finalizers:
    - some-finalizer

# All of the below namespaces will inherit the defaults, and can optionally
# override fields as required.
namespaces:
  # This namespace won't get created as namespaces are disabled by default
  foo: {}

  # This namespace will get created, as it enables itself
  bar:
    enabled: true

  # This namespace will get created, and overrides some of the defaults
  baz:
    enabled: true
    name: baz # Overrides the name to remove the `ns-` prefix
    annotations:
      is-baz: "true"
    finalizers: []
